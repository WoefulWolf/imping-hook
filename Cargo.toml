[package]
name = "imping-hook"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
authors = ["WoefulWolf"]
repository = "https://github.com/WoefulWolf/imping-hook"
description = "In-process function hooking for the imping toolkit."
publish = false

[dependencies]
detour = "=0.10.0"
# Allocates and protects the injection stub's memory.
region = "4"

# Assembles the context stub and `asm` injections (x86-64 only). Already a
# dependency of detour; `code_asm` adds the assembler.
[target.'cfg(target_arch = "x86_64")'.dependencies.iced-x86]
version = "1"
default-features = false
features = ["std", "code_asm"]

# Instruction-cache flush after writing the stub, and GetLastError. Other
# platforms don't need the flush on x86.
[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Threading",
]

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
missing_safety_doc = "warn"
